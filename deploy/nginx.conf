server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name marvelsoftwares.in www.marvelsoftwares.in _;

    # Canonical 301 redirect ONLY for explicit www requests
    if ($host = 'www.marvelsoftwares.in') {
        return 301 https://marvelsoftwares.in$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options ALLOWALL always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location /preview/marvelslice/ {
        proxy_pass https://marvelslice.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host marvelslice.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_redirect https://marvelslice.com/ /preview/marvelslice/;
        sub_filter_once off;
        sub_filter '</head>' '<script>history.replaceState(null, "", "/");</script></head>';
        sub_filter 'href="/' 'href="/preview/marvelslice/';
        sub_filter 'src="/' 'src="/preview/marvelslice/';
        sub_filter 'action="/' 'action="/preview/marvelslice/';
    }

    location /preview/lms/ {
        proxy_pass https://lms.marvelslice.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host lms.marvelslice.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_redirect https://lms.marvelslice.com/ /preview/lms/;
        sub_filter_once off;
        sub_filter '</head>' '<script>history.replaceState(null, "", "/login");</script></head>';
        sub_filter 'href="/' 'href="/preview/lms/';
        sub_filter 'src="/' 'src="/preview/lms/';
        sub_filter 'srcSet="/' 'srcSet="/preview/lms/';
        sub_filter 'imageSrcSet="/' 'imageSrcSet="/preview/lms/';
        sub_filter 'action="/' 'action="/preview/lms/';
    }

    location /_next/ {
        proxy_pass https://lms.marvelslice.com/_next/;
        proxy_ssl_server_name on;
        proxy_set_header Host lms.marvelslice.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_set_header Accept-Encoding "";
    }

    location /preview/marvelvillas/ {
        proxy_pass https://www.marvelvillas.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.marvelvillas.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_redirect https://www.marvelvillas.com/ /preview/marvelvillas/;
        sub_filter_once off;
        sub_filter '</head>' '<base href="/preview/marvelvillas/"><script>history.replaceState(null, "", "/");</script></head>';
        sub_filter 'href="/' 'href="/preview/marvelvillas/';
        sub_filter 'src="/' 'src="/preview/marvelvillas/';
        sub_filter 'action="/' 'action="/preview/marvelvillas/';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Behind reverse proxies / panels that forward Host as 127.0.0.1, nginx's implicit
    # directory trailing-slash redirects would emit loopback "Location: http://127.0.0.1/...".
    # Force relative redirects and serve directory index files directly — no 301 ever.
    absolute_redirect off;
    port_in_redirect off;

    location / {
        # $uri/index.html lets /build resolve to the prerendered file WITHOUT the implicit
        # directory 301 that breaks deployments behind hosts that don't rewrite Location.
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
