<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hic-title hic-desc" width="600" height="420">
  <title id="hic-title">From Ideas to Intelligent Solutions</title>
  <desc id="hic-desc">A geometric software core connected to floating modules for code, automation, cloud infrastructure and data processing, with a forward arrow representing business growth.</desc>
  <style>
        .hic-float { animation: hic-float 6s ease-in-out infinite; }
        .hic-flow { stroke-dasharray: 5 7; animation: hic-dash 2.8s linear infinite; }
        .hic-pulse { transform-box: fill-box; transform-origin: center; animation: hic-pulse 2.6s ease-in-out infinite; }
        @keyframes hic-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes hic-dash { to { stroke-dashoffset: -24; } }
        @keyframes hic-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.78); } }
        @media (prefers-reduced-motion: reduce) {
          .hic-float, .hic-flow, .hic-pulse { animation: none; }
          .hic-flow { stroke-dasharray: none; }
        }
      </style>
